<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Display – MPV</title>
<style>
:root { color-scheme: light dark; font-family: system-ui,sans-serif; }
body { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
h1 { font-size: 1.5rem; }
label { display: block; margin-bottom: .5rem; }
input, button { font: inherit; padding: .75rem; border: 1px solid #888; border-radius: .4rem; }
input { width: 100%; box-sizing: border-box; }
.buttons { display: flex; gap: .5rem; margin-top: .75rem; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .6; }
#status, #message { overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>HTML Display – MPV</h1>
<form id="play">
<label for="source">Video URL</label>
<input id="source" name="source" type="url" required placeholder="https://…" autocomplete="off" maxlength="4096">
<div class="buttons">
<button id="submit" type="submit">Play on display</button>
<button id="stop" type="button">Stop</button>
</div>
</form>
<p id="status" role="status">Connecting…</p>
<p id="message" role="alert"></p>
<script>
const form = document.getElementById('play');
const source = document.getElementById('source');
const submit = document.getElementById('submit');
const stop = document.getElementById('stop');
const status = document.getElementById('status');
const message = document.getElementById('message');
let busy = false;
async function refresh() {
  try {
    const response = await fetch('/api/player', {cache:'no-store'});
    if (!response.ok) throw new Error('Status unavailable');
    const player = await response.json();
    status.textContent = 'Status: ' + player.state + (player.error ? ' — ' + player.error : '');
  } catch (_) {
    status.textContent = 'Controller unavailable';
  }
}
async function command(action, body) {
  if (busy) return;
  busy = true;
  submit.disabled = stop.disabled = true;
  message.textContent = '';
  try {
    const options = {method:'POST'};
    if (body) {
      options.headers = {'Content-Type':'application/json'};
      options.body = JSON.stringify(body);
    }
    const response = await fetch('/api/player/' + action, options);
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Request failed');
    message.textContent = action === 'play' ? 'Playback requested.' : 'Stop requested.';
  } catch (error) {
    message.textContent = error.message;
  } finally {
    await refresh();
    busy = false;
    submit.disabled = stop.disabled = false;
  }
}
form.addEventListener('submit', event => {
  event.preventDefault();
  const url = source.value.trim();
  if (!/^https?:\/\//i.test(url)) {
    message.textContent = 'Enter an HTTP or HTTPS video URL.';
    return;
  }
  command('play', {source:url});
});
stop.addEventListener('click', () => command('stop'));
refresh();
setInterval(() => { if (!busy) refresh(); }, 2000);
</script>
</body>
</html>
