name: MPV controller Go tests
on:
  pull_request:
    paths:
      - 'config/nixos/modules/html-display-mpv-src/**'
      - '.github/workflows/mpv-controller.yml'
  push:
    paths:
      - 'config/nixos/modules/html-display-mpv-src/**'
      - '.github/workflows/mpv-controller.yml'
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/nixos/modules/html-display-mpv-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: config/nixos/modules/html-display-mpv-src/go.mod
      - run: gofmt -l . | tee /tmp/unformatted.txt
      - run: test ! -s /tmp/unformatted.txt
      - run: go vet ./...
      - run: go test ./...
